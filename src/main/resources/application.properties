# Configuração do Banco de Dados Principal
# Produção (Neon): definir no Cloud Run as variáveis DB_JDBC_URL=jdbc:postgresql://<host-neon>/neondb?sslmode=require, DB_USERNAME e DB_PASSWORD
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/dbpudim}

# Multi-tenancy por coluna discriminadora (tenant_id)
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.hibernate-orm.database.generation=update
quarkus.flyway.migrate-at-start=false

# JWT
mp.jwt.verify.issuer=https://pudim.com/issuer
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:privateKey.pem}
%dev.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:publicKey.pem}

# InfinitePay Checkout (APP_PUBLIC_URL = URL pública do frontend/backend, usada em redirect e webhook)
infinitepay.api-url=${INFINITEPAY_API_URL:https://api.checkout.infinitepay.io}
app.public-url=${APP_PUBLIC_URL}

# Quarkus Quinoa
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.build-dir=dist
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.dev-server.port=5173